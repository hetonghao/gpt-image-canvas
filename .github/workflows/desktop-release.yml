name: AI-Cove-Design Desktop Release

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: Build release or debug desktop artifacts
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.14.2 --activate

      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release script tests
        run: pnpm desktop:build:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare Tauri test resources
        shell: bash
        run: mkdir -p src-tauri/resources/sidecar

      - name: Test Tauri shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.AI_COVE_DESIGN_TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build desktop artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.AI_COVE_DESIGN_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.AI_COVE_DESIGN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.build_profile }}" = "debug" ]; then
            pnpm desktop:build -- --debug
          else
            pnpm desktop:build
          fi

      - name: Upload platform desktop release
        uses: actions/upload-artifact@v4
        with:
          name: ai-cove-design-desktop-${{ matrix.platform }}
          path: desktop-release/*
          if-no-files-found: error

  assemble:
    name: Assemble desktop release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.14.2 --activate

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-release-inputs
          pattern: ai-cove-design-desktop-*

      - name: Assemble merged updater manifest
        run: pnpm desktop:assemble-release desktop-release-inputs desktop-release

      - name: Upload merged desktop release
        uses: actions/upload-artifact@v4
        with:
          name: ai-cove-design-desktop-release
          path: desktop-release/*
          if-no-files-found: error
